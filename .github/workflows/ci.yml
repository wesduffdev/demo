# Buyer's Desk — CI gate (BD-002).
#
# The default branch (`buyers-desk-setup`) is protected / PR-only: nobody
# commits to it directly (see .claude/rules/code-quality-testing.md), and this
# workflow is the gate every pull request must pass before merge. It fails the
# job on any lint, format, or test violation — see `make ci` for the local
# equivalent of exactly what runs here.
name: CI

# Least-privilege: this job only reads the repo (checkout + lint/format/test);
# it references no secrets and needs no write scopes.
permissions:
  contents: read

on:
  pull_request:
  push:
    # Never runs against the protected default branch directly — pushes only
    # land here from feature branches; the default branch only ever receives
    # commits via a reviewed, CI-gated pull request.
    branches-ignore:
      - buyers-desk-setup

jobs:
  lint-format-test:
    name: Lint, format check, and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project + dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format --check)
        run: ruff format --check .

      - name: Run tests (pytest)
        run: pytest
